
[sweeper_maid-common-config]
#If 0, disable item sweeping. If > 0, cool down (in seconds) between two item sweeping.
#若为 0 则禁用自动清扫；若大于 0，则为两次清扫之间的冷却时间（秒）。
#Range: 0 ~ 360000
ITEM_SWEEP_INTERVAL = 600
#Permission level of a player to open the dustbin.
#打开垃圾箱所需的权限等级。
#Range: 0 ~ 4
PERMISSION_LEVEL_DUSTBIN = 0
#Items in this list will be cleaned but not added to the dustbin.
#此列表中的物品会被清扫，但不会存入垃圾箱。
ITEM_BLACKLIST = ["minecraft:cobblestone", "minecraft:sand"]
#Item overload in a chunk. If exceeded, a warning message will be sent.
#区块内的掉落物数量超过此值时，将发送一条警告消息。
#Range: 1 ~ 6400000
ITEM_OVERLOAD_THRESHOLD = 640
#Other entities of types will be killed when cleaning, e.g. arrows. You can also kill mobs or even players by setting this.
#清扫时额外清除的实体类型，例如箭矢。也可以借此清除生物甚至玩家。
EXTRA_ENTITY_TYPES = ["minecraft:arrow", "minecraft:spectral_arrow", "oceanworld:drip_ice"]
#What message will be sent to players when there's 15s, 30s and 60s left to sweep. "$1" stands for the remaining time (in seconds). Leave empty to use the built-in localized message (follows the client language).
#距离清扫还有 15 秒、30 秒、60 秒时发送给玩家的提示消息。"$1" 为剩余时间（秒）。留空则使用内置本地化消息。
MESSAGE_BEFORE_SWEEP_15_30_60 = ""
#What message will be sent to players when there's 1s~10s left to sweep. "$1" stands for the remaining time (in seconds). Leave empty to use the built-in localized message (follows the client language).
#距离清扫还有 1~10 秒时发送给玩家的提示消息。"$1" 为剩余时间（秒）。留空则使用内置本地化消息。
MESSAGE_BEFORE_SWEEP_1_10 = ""
#What message will be sent to players after a sweep. "$1" stands for the number of killed dropped items, "$2" stands for the number of killed entities, and "$3" stands for the number of blacklist items. Leave empty to use the built-in localized message (follows the client language).
#清扫完成后发送给玩家的消息。"$1" 为清除的掉落物品数，"$2" 为清除的实体数，"$3" 为黑名单物品数。留空则使用内置本地化消息。
MESSAGE_AFTER_SWEEP = ""
#What chat message will be sent to players after a sweep. Command will be appended to the end of the chat message. Leave empty to use the built-in localized message (follows the client language).
#清扫完成后发送给玩家的聊天消息，末尾会附加垃圾箱链接。留空则使用内置本地化消息。
CHAT_MESSAGE_AFTER_SWEEP = ""
#What message will be sent to players when open a wrong dustbin. Leave empty to use the built-in localized message (follows the client language).
#打开无效垃圾箱时发送给玩家的消息。留空则使用内置本地化消息。
MESSAGE_WRONG_DUSTBIN = ""
#Name of dustbins. Leave empty to use the built-in localized name (follows the client language).
#垃圾箱名称前缀。留空则使用内置本地化名称（跟随游戏语言）。
DUSTBIN_NAME = ""
#Max item count that can be stacked in a single dustbin slot. Bigger values reduce the chance that the dustbin gets full.
#单个垃圾箱槽位最多可堆叠的物品数量。更大的值可降低垃圾箱被装满的概率。
#Range: 1 ~ 2147483647
DUSTBIN_SLOT_CAPACITY = 1000000
#Message to be sent when item overload threshold is exceeded. "$1" stands for chunk X position, "$2" stands for chunk Z position, "$3" stands for item count, and "$4" stands for item id. Leave empty to use the built-in localized message (follows the client language).
#区块掉落物过载时发送的消息。"$1" 为区块 X 坐标，"$2" 为区块 Z 坐标，"$3" 为物品数量，"$4" 为物品 ID。留空则使用内置本地化消息（跟随游戏语言）。
OVERLOAD_MESSAGE = ""
#Global number of dropped item entities (piles) in all dimensions. If exceeded, an extra sweeping will be triggered before the scheduled interval (subject to the cooldown below). Set a huge value to disable.
#所有维度中掉落物实体（堆）的总数阈值。超过此值将触发一次额外清扫（受下方冷却限制）。设为极大值可禁用。
#Range: 1 ~ 2147483647
GLOBAL_ITEM_COUNT_THRESHOLD = 500
#Cooldown (in seconds) between two overload-triggered sweepings.
#两次过载触发清扫之间的冷却时间（秒）。
#Range: 0 ~ 86400
OVERLOAD_SWEEP_COOLDOWN = 60
#Message to be sent to all players after an overload-triggered sweeping. "$1" stands for the number of swept item piles. Leave empty to use the built-in localized message (follows the client language).
#过载触发清扫后发送给所有玩家的提示消息。"$1" 为本次清扫的掉落物堆数。留空则使用内置本地化消息。
MESSAGE_OVERLOAD_SWEEP = ""
#Experience points needed to convert into 1 experience bottle (rounded up). A bottle gives 3~11 xp, so a loss is expected to avoid xp duplication.
#每多少点经验折算为 1 个附魔之瓶（向上取整）。附魔之瓶开启后只给 3~11 点经验，适度折损可避免刷经验。
#Range: 1 ~ 2147483647
XP_PER_BOTTLE = 10
#Message appended to the sweep chat message when experience orbs were collected. "$1" stands for the total experience, "$2" stands for the number of converted bottles. Leave empty to use the built-in localized message (follows the client language).
#清扫收集到经验时追加到聊天消息的提示。"$1" 为收集的经验总值，"$2" 为转换的附魔之瓶数量。留空则使用内置本地化消息。
MESSAGE_XP_CONVERTED = ""
#Whether to send the Yansunsky fork welcome message when a player joins. It can also be toggled with /sweepermaid welcome on|off.
#玩家登录时是否发送 Yansunsky 分支声明。也可使用 /sweepermaid welcome on|off 开关。
SHOW_FORK_WELCOME = true
#Dustbin auto trash mode. "clear" empties all dustbins, "pack" compresses the dustbin contents into a file under the world save and then empties them. Only used by the scheduled auto trash and the /sweepermaid trash command.
#垃圾桶自动处理模式。"clear" 清空所有垃圾桶；"pack" 将垃圾桶内容压缩存盘后清空。仅用于定时自动处理与 /sweepermaid trash 指令。
DUSTBIN_TRASH_MODE = "clear"
#Interval (in seconds) of the scheduled dustbin auto trash. -1 disables the auto trash.
#垃圾桶自动处理间隔（秒）。-1 表示禁用自动处理。
#Range: -1 ~ 86400
DUSTBIN_TRASH_INTERVAL = -1
#Message sent to online operators after the dustbins are cleared. "$1" stands for the number of removed items. Leave empty to use the built-in localized message (follows the client language).
#垃圾桶被清空后发送给在线管理员的提示消息。"$1" 为清除的物品总数。留空则使用内置本地化消息。
MESSAGE_DUSTBIN_CLEARED = ""
#Message sent to online operators after the dustbins are packed. "$1" stands for the number of packed items, "$2" stands for the output file path. Leave empty to use the built-in localized message (follows the client language).
#垃圾桶被打包后发送给在线管理员的提示消息。"$1" 为打包的物品总数，"$2" 为输出文件路径。留空则使用内置本地化消息。
MESSAGE_DUSTBIN_PACKED = ""
#Message sent to the player after a pack file is imported. "$1" stands for the file name, "$2" stands for the number of imported items. Leave empty to use the built-in localized message (follows the client language).
#导入打包文件后发送给玩家的提示消息。"$1" 为文件名，"$2" 为导入的物品总数。留空则使用内置本地化消息。
MESSAGE_DUSTBIN_UNPACKED = ""
